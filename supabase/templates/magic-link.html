<!-- Supabase > Authentication > Emails > "Magic link or OTP". Subject: Your Built2Bid verification code -->
<!-- Sent when an existing account asks for a sign-in code. {{ .Token }} is filled in by Supabase. -->
<div style="font-family:Inter,Arial,sans-serif;background:#F4F6F8;padding:32px 16px;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #E2E8F0;">
    <div style="background:#0B2D4D;padding:20px 24px;">
      <span style="font-family:Montserrat,Arial,sans-serif;font-size:22px;font-weight:800;color:#ffffff;">Built<span style="color:#00C2E0;">2</span>Bid</span>
    </div>
    <div style="padding:28px 24px;color:#0B2D4D;">
      <h2 style="margin:0 0 12px;font-family:Montserrat,Arial,sans-serif;font-size:20px;">Your Built2Bid verification code</h2>
      <p style="margin:0 0 8px;color:#6B7A89;font-size:15px;line-height:1.5;">Hi,</p>
      <p style="margin:0 0 16px;color:#6B7A89;font-size:15px;line-height:1.5;">Use this code to securely sign in to Built2Bid:</p>
      <p style="margin:0 0 20px;font-size:32px;font-weight:800;letter-spacing:8px;color:#0B2D4D;">{{ .Token }}</p>
      <p style="margin:0 0 20px;color:#6B7A89;font-size:15px;line-height:1.5;">Enter this code on the Built2Bid website to continue.</p>
      <p style="margin:0 0 20px;color:#6B7A89;font-size:13px;">If you didn't request this code, you can safely ignore this email.</p>
      <p style="margin:0;color:#6B7A89;font-size:13px;">Built2Bid<br>built2bid.org</p>
    </div>
  </div>
</div>
