# Fails a pull request when product features and their registry metadata drift apart
# (src/lib/features/registry.ts): missing copy, unregistered data-feature targets, premium locks
# without a registry entry, or walkthrough targets that no longer exist.
name: Feature registry check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vitest run tests/feature-registry.test.ts
