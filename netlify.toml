# Netlify detects Next.js and applies its Next.js runtime automatically (server routes,
# middleware/proxy, image optimization). No plugin entry is needed.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Welcome video, poster and tour stills (public/media). Served straight from Netlify's CDN with
# byte-range support, so the MP4 (faststart: index at the front) streams instead of downloading
# whole. File names carry a version (meet-built2bid-v1.mp4): ship a new name to replace the video.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/media/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The default netlify.app address serves the same site as built2bid.org. Send it to the real domain
# with a permanent redirect so search engines and shared links consolidate on one host. Deploy
# previews (deploy-preview-N--built2bid.netlify.app) and branch deploys use other host names and are
# not affected. force = true makes this run before the Next.js runtime.
[[redirects]]
  from = "https://built2bid.netlify.app/*"
  to = "https://built2bid.org/:splat"
  status = 301
  force = true
